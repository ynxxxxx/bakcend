name: Backend CI & Security Validation

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  db-migrations-and-rls-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start PostgreSQL 15 Container
        run: |
          docker run -d --name postgres-test -p 5432:5432 -e POSTGRES_PASSWORD=postgrespassword -e POSTGRES_DB=postgres postgres:15-alpine
          until docker exec postgres-test pg_isready -U postgres -d postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          echo "PostgreSQL is ready!"

      - name: Setup Mock Supabase Auth & pg_cron Schema
        run: |
          docker exec -i postgres-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/00_setup_auth_mock.sql

      - name: Run SQL Migrations
        run: |
          for file in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "Applying migration: $file"
            docker exec -i postgres-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Execute Phase 1 Comprehensive RLS & Security Test Suite
        run: |
          echo "============================================================"
          echo "Executing Phase 1 Exhaustive Security & Escalation Matrix..."
          echo "============================================================"
          docker exec -i postgres-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/01_phase1_rls_test.sql
          echo "============================================================"
          echo "ALL TESTS PASSED SUCCESSFULLY!"
          echo "============================================================"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Static SQL Linter
        run: |
          python supabase/tests/run_local_lint.py
