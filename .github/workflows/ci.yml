name: Backend CI & Security Validation

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  db-migrations-and-rls-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Run Official Supabase Test Suite
        run: |
          chmod +x scripts/test.sh
          ./scripts/test.sh
