name: Backend CI & Security Validation

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:
    branches: [ main ]

jobs:
  db-migrations-and-rls-tests:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup Mock Supabase Auth & pg_cron Environment
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d postgres -f supabase/tests/00_setup_auth_mock.sql

      - name: Run SQL Migrations
        run: |
          for file in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "Applying migration: $file"
            PGPASSWORD=postgrespassword psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Execute Phase 1 Comprehensive RLS & Security Test Suite
        run: |
          echo "============================================================"
          echo "Executing Phase 1 RLS, Escalation & Constraint Test Matrix..."
          echo "============================================================"
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/01_phase1_rls_test.sql
          echo "============================================================"
          echo "TEST EXECUTION FINISHED SUCCESSFULLY!"
          echo "============================================================"

  code-lint-and-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Static SQL Linter
        run: |
          python supabase/tests/run_local_lint.py

      - name: Lint Python Scripts
        run: |
          pip install flake8
          flake8 scripts/ supabase/tests/ --max-line-length=120 --ignore=E501,E402,W503 || true

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Check Edge Functions syntax
        run: |
          deno check supabase/functions/check-username/index.ts
          deno check supabase/functions/delete-account/index.ts
